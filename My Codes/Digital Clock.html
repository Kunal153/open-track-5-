<!DOCTYPE html>
<html>
    <head>
        <title>Digital Clock</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <style>
	/* Created by Bartika🎶 */

/* Created by Kunal Chaudhari */

/* Created by Bartika🎶 */

body {
    background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn%3AANd9GcQeyxIYiYoq8byY_GyK45kfjlsaAIQ3v7PPCXIRqR87EzE51ju3&usqp=CAU");
    margin:0;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
}
h1{
    width:200px;
    padding:80px;
    background:#221211;
    text-align:center;
    color:white;
    text-shadow:0 0 4px deeppink,
                0 0 4px deeppink,
                0 0 8px deeppink,
                0 0 8px deeppink,
                0 0 40px deeppink,
                0 0 40px deeppink,
                0 0 40px deeppink,
                0 0 80px deeppink,
                0 0 80px deeppink,
                0 0 80px deeppink;
    font-family:cursive;
    font-size:50px;
    border-radius:10%;
    box-shadow:0 0 30px 0 white;
}
	
	
	</style>
	
	
	</head>
    <body>
        <h1 id="clock"></h1>
		
		<script>
		// Created by Bartika🎶

// Created by Kunal Chaudhari

// Created by Bartika🎶

$("body").ready(function start(){
    var today = new Date();
    var h = today.getHours()
    var hour = today.getHours()>12 ? today.getHours()-12 : today.getHours();
    var m = today.getMinutes();
    var s = today.getSeconds();
    hour = correctTime(hour);
    m = correctTime(m);
    s = correctTime(s);
    mm= correctHour(h);
    document.getElementById('clock').innerHTML = hour + ":" + m + ":" + s + " " + mm;
    var t = setTimeout(start, 1000);
})
function correctHour(h){
    if (h>=12){
        mm="pm"
    }
    else{
        mm="am"
    }
    return mm;
}
function correctTime(i){
    if (i < 10){
        i= "0" + i;
    }
    return i;
}


		
		</script>
    </body>
</html>
